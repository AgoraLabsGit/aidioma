  - id: AI-TUTOR-001
    title: Tool-using tutor and durable agent workflows
    area: ai-agents
    status: deferred
    kind: research
    founder_approval: required
    summary: Define how learners can ask contextual follow-up and open Spanish-learning questions without confusing tutoring with graded Practice, and preserve durable agent ideas without committing to Eve, Workflow, or another runtime.
    spec: null
