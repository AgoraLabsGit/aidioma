version: 1
fixes:
  - id: EVALUATION-FIX-001
    title: Local non-exact Practice answers remain ungraded
    area: evaluation
    status: complete
    summary: A reasonable non-exact answer reaches the AI fallback and displays a retryable grading failure.
    related_work: EVALUATION-001
    reproduction: On the local Practice route, answer “Para cena, podría hacer la pasta sin queso por favor?” for “For dinner, could you make the pasta without cheese, please?” while that answer is absent from the deterministic set and the provider fallback is unavailable.
    expected: The configured evaluator grades the answer; if evaluation is unavailable, the application detects and explains that state without presenting an endless retry loop.
    actual: Before correction, the answer was preserved but remained ungraded in a retryable “Try grading again” state.
    evidence:
      - Reproduced the learner report against the production-mode local route; semantic comparison fell through to AI and returned HTTP 503 because the evaluation-only Gateway credential was not configured.
      - Configuration failures are now non-retryable, so Practice preserves the answer and offers Continue without grading instead of an endless Try grading again loop.
      - Gateway evaluator, route, and component tests passed (61 focused tests); the full app suite passed with 261 tests.
      - The production-route Practice smoke proved fail-closed credential isolation and the learner recovery path without repurposing the ambient Gateway credential.
      - After founder-authorized local key reuse, the live evaluation proof and production-mode Practice API/browser path graded non-exact answers through AI successfully.
  - id: CONTENT-FIX-001
    title: Enforce contentVersion changes when canonical content changes
    area: content
    status: open
    summary: Deterministic content hashes can change without a required contentVersion increase.
    related_work: CONTENT-GENERATION-001
    reproduction: Modify canonical lesson content without changing contentVersion and run the current validator.
    expected: Validation rejects a changed hash without an intentional version increase.
    actual: The current immutable-ID snapshot does not compare prior content hash and version.
    evidence: []
  - id: SECURITY-FIX-001
    title: Make the fixture Practice evaluator explicitly local-only
    area: platform
    status: open
    summary: The unauthenticated fixture-backed Practice evaluation route relies on one opt-in flag without asserting a development environment.
    related_work: PLATFORM-SECURITY-001
    reproduction: Enable AIDIOMA_ENABLE_LOCAL_PRACTICE_EVALUATION outside a development runtime.
    expected: The route refuses to start or serve outside an explicitly local development boundary.
    actual: The opt-in flag alone admits the fixture route.
    evidence: []
