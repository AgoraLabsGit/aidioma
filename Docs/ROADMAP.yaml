# ROADMAP — the single plan SSOT. Status here wins over every other document.
# status: pending | active | built | proven | closed | parked
# Every wave: sized to ONE agent session; >=1 slice the operator can SEE working (operator_sees).
# Wave OPEN = <=5-bullet plain-language briefing + operator approval.
# Wave CLOSE = /close only (full gates + audit + recap + testing script + operator GO).
version: 1
updated: 2026-07-28

mvp_finish_line: >
  The 12 A1 lessons are live and practiceable in a deployed app. A learner signs in, taps
  Continue, and runs a Learn -> Quiz(MC) -> Words -> Sentences -> Story session inside the one
  chat-centric panel: they type a translation, it is graded instantly and for free (AI only when their
  answer matches no authored alternate), they can ask the tutor a question inline, they get a
  session recap (score, items that moved up, top error tags), and the next day their weak items
  and unconfirmed lessons re-serve automatically. Two modalities at launch: typed translation
  (Both directions by default) + flashcards. "Done" = that loop working on real data on a real screen.

# --- TWO LANES ------------------------------------------------------------------------------
# This project runs two parallel lanes under this one roadmap. Only ONE wave per lane is active
# at a time; the operator touches each wave exactly three times (approve plan / VERIFIED pass /
# GO the push). Lanes coordinate through files, never chat.
#   Lane A (App)     - the greenfield Next.js app. Owner: App Design Coordinator.
#   Lane C (Content) - lesson authoring. Owner: Lesson Plan agent. Content and working records
#                      live in /content; schema rulings live in Docs/Registers/schema-proposals.md.
# STANDING SEQUENCING (operator, 2026-07-23):
#   1. Lane A opens with a mandatory DESIGN-CLOSE wave (A0). No app code until it closes.
#   2. Lane C is PARKED at 3 pilot lessons. Un-pause trigger = operator's explicit go, given
#      only AFTER A0 closes (A0 also rules on the schema proposals content needs to resume).

verify:
  # Content lane has real, running root-workspace gates. App lane gates are set when the
  # app is scaffolded in wave A1 - a gate that does not yet exist counts as not-run = FAIL.
  content:
    typecheck: "npm run content:typecheck"
    validate:  "npm run content:validate"
    smoke:     "npm run contract:smoke && npm run content:fixtures && npm run prototype:check"
  app:
    typecheck: "npm run app:typecheck"
    lint:      "npm run app:lint"
    test:      "npm run app:test"
    build:     "npm run app:build"
    smoke:     "npm run app:smoke"

# ============================================================================================
# LANE A - THE APP
