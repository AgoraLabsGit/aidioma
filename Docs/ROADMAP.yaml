waves:
  - id: A0
    lane: App
    title: Design Close - settle every open decision into a final spec
    status: closed
    operator_sees: >
      A finished module spec plus a written decision record for every open question, so the app
      can be built without re-litigating design. Nothing on screen yet - this wave produces the
      decisions the build waves stand on.
    depends_on: []
    unblocks: "A1 (all), A2 (provider/model), Lane C un-pause (schema rulings in A0-3)"
    slices:
      - id: A0-1
        title: UI / interaction decisions -> Module spec
        status: proven
        summary: >
          Rule on the contested cuts (Direction section, lesson multi-select, goal
          presets+custom / "Reminders: none" row - HANDOFF §3 cuts #2-4; cut #1 already resolved)
          and the queued module-spec UI items (first-run zero state, unified status vocabulary,
          word-level error diff, split live "today's accuracy" from next-day-confirmed
          proficiency, lesson-detail pages for every lesson, "Review · N due" row on Home,
          quieter card furniture, Home-path vs Lessons-tab duplication). Output: Specs/Features
          module spec, decided one block at a time.
      - id: A0-2
        title: Launch scope + product calls -> ADRs
        status: proven
        summary: >
          Consensus §2 disagreements (vocab-load guideline 10 vs 15-20; mastery spacing
          >=2 days; direction policy EN->ES-only vs both; evaluationCache drop vs repurpose) and
          §3 open questions (PROVIDER/MODEL choice - blocks A2; A1-only start-level story;
          content review bar / reviewer; success metric = day-7 return-to-session; streak /
          notification posture). Each becomes an ADR.
      - id: A0-3
        title: Feature decisions + rule on pending schema proposals -> ADRs
        status: proven
        summary: >
          FEATURES-ROADMAP §9: 5-level mastery scale + user-set threshold vs binary D2 (§7);
          notes model (feature 8, extends saved_items). AND, in the App Design Coordinator role,
          rule on the parked lesson-schema proposals: P-003 (VocabItem accept sets +
          formula.courtesy tag + setId), P-004 (dialect/region dimension, feature 14), P-005
          (referenceCard study-card kind, feature 10). These rulings are what Lane C needs before
          it can un-pause. Record in Specs/ADRs + Docs/Registers/schema-proposals.md.
      - id: A0-4
        title: Engine specs -> Area specs
        status: proven
