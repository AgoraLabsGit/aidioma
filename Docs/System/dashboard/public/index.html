<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Praxis</title>
    <link rel="stylesheet" href="/styles.css?v=phase006-12" />
    <script src="/app.js?v=phase006-12" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <aside class="sidebar" aria-label="Primary">
      <div class="sidebar-brand">
        <img
          class="brand-logo brand-logo-on-dark"
          src="/brand/praxis-wordmark-white.svg"
          alt="Praxis"
          width="81"
          height="22"
        />
        <img
          class="brand-logo brand-logo-on-light"
          src="/brand/praxis-wordmark-black.svg"
          alt=""
          width="81"
          height="22"
          aria-hidden="true"
        />
      </div>
      <nav class="tabs" aria-label="Dashboard pages">
        <button type="button" class="tab" data-page="active" aria-current="page">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="7.25" />
              <circle cx="12" cy="12" r="2.25" />
            </svg>
          </span>
          Active
        </button>
        <button type="button" class="tab" data-page="work">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 7.5l1.5 1.5L10 5.5" />
              <path d="M5 12.5l1.5 1.5L10 10.5" />
              <path d="M5 17.5h10" />
            </svg>
          </span>
          Work
        </button>
        <button type="button" class="tab" data-page="roadmap">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 12h4.5" />
              <path d="M14.5 12H19" />
              <circle cx="12" cy="12" r="2.25" />
              <circle cx="5" cy="12" r="1.5" />
              <circle cx="19" cy="12" r="1.5" />
            </svg>
          </span>
          Roadmap
        </button>
        <button type="button" class="tab" data-page="activity">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 12h3.5l2-5.5 3 12L15.5 9 17 12h3" />
            </svg>
          </span>
          Activity
        </button>
        <button type="button" class="tab" data-page="knowledge">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M5 5.5h6v13H7A2 2 0 0 1 5 16.5v-11z" />
              <path d="M13 5.5h6v11a2 2 0 0 1-2 2h-4v-13z" />
            </svg>
          </span>
          Knowledge
        </button>
      </nav>
      <div class="sidebar-foot">
        <button
          id="issue-pill"
          type="button"
          class="sidebar-foot-btn issue-pill"
          title="Signals"
          aria-label="Open Signals"
        >
          <span class="foot-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M12 4.5L20 19H4L12 4.5z" />
              <path d="M12 10v4" />
              <circle cx="12" cy="16.5" r="0.9" fill="currentColor" stroke="none" />
            </svg>
          </span>
        </button>
        <button
          id="docs-pill"
          type="button"
          class="sidebar-foot-btn docs-pill"
          title="Docs"
          aria-label="Open Docs"
        >
          <span class="foot-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M7 4.5h7.5L19 9v10.5H7z" />
              <path d="M14.5 4.5V9H19" />
              <path d="M10 13h6M10 16.5h4" />
            </svg>
          </span>
        </button>
        <button
          id="theme-toggle"
          type="button"
          class="sidebar-foot-btn theme-btn"
          title="Theme"
          aria-label="Toggle light and dark theme"
          aria-pressed="false"
        >
          <span class="foot-icon theme-icon-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M15.5 3.5A8.5 8.5 0 1 0 20.5 14 6.5 6.5 0 0 1 15.5 3.5z" />
            </svg>
          </span>
          <span class="foot-icon theme-icon-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6.2 6.2l1.6 1.6M16.2 16.2l1.6 1.6M17.8 6.2l-1.6 1.6M7.8 16.2l-1.6 1.6" />
            </svg>
          </span>
        </button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="page-title">Active</h1>
        </div>
        <div class="topbar-right">
          <div class="heartbeat">
            <span id="indexed-at">indexed —</span>
          </div>
          <button
            id="worktrees-panel-btn"
            type="button"
            class="reindex-btn worktrees-badge-btn"
            title="Git worktrees"
            aria-label="Open git worktrees"
            aria-expanded="false"
            aria-controls="worktrees-panel"
          >
            <svg class="reindex-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"
              />
            </svg>
            <span id="worktrees-count" class="worktrees-count" hidden>0</span>
          </button>
          <button id="commands-panel-btn" type="button" class="reindex-btn" title="Commands" aria-label="Open commands panel" aria-expanded="false" aria-controls="commands-panel">
            <svg class="reindex-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M4 6h16v2H4V6zm0 5h10v2H4v-2zm0 5h16v2H4v-2z"
              />
            </svg>
          </button>
          <button id="reindex" type="button" class="reindex-btn" title="Reindex" aria-label="Reindex now">
            <svg class="reindex-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M17.65 6.35A7.958 7.958 0 0 0 12 4C7.58 4 4.01 7.58 4.01 12S7.58 20 12 20c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
              />
            </svg>
          </button>
        </div>
      </header>
      <aside id="worktrees-panel" class="commands-panel worktrees-panel" hidden>
        <div class="commands-panel-header">
          <h2>Worktrees</h2>
          <button type="button" id="worktrees-panel-close" class="reindex-btn" title="Close" aria-label="Close worktrees panel">×</button>
        </div>
        <div id="worktrees-panel-body" class="commands-panel-body"></div>
      </aside>
      <aside id="commands-panel" class="commands-panel" hidden>
        <div class="commands-panel-header">
          <h2>Commands</h2>
          <button type="button" id="commands-panel-close" class="reindex-btn" title="Close" aria-label="Close commands panel">×</button>
        </div>
        <div id="commands-panel-body" class="commands-panel-body"></div>
      </aside>

      <main id="main">
        <section id="page-active" class="page" data-page-panel="active"></section>
        <section id="page-roadmap" class="page" data-page-panel="roadmap" hidden></section>
        <section id="page-activity" class="page" data-page-panel="activity" hidden></section>
        <section id="page-knowledge" class="page page-knowledge" data-page-panel="knowledge" hidden></section>
        <section id="page-work" class="page" data-page-panel="work" hidden></section>
        <section id="page-signals" class="page" data-page-panel="signals" hidden></section>
        <section id="page-docs" class="page page-docs" data-page-panel="docs" hidden></section>
      </main>
    </div>

    <aside id="detail" class="detail" hidden>
      <div class="detail-resize" data-resize="detail" title="Drag to resize" aria-hidden="true"></div>
      <div class="detail-header">
        <div class="detail-actions detail-actions-start">
          <button id="detail-collapse" type="button" class="icon-btn" title="Collapse panel" aria-label="Collapse panel" aria-expanded="true">›</button>
        </div>
        <div class="detail-title-row">
          <h2 id="detail-title">Detail</h2>
          <button id="detail-title-copy" type="button" class="id-copy detail-title-copy" data-copy="" title="Copy id" aria-label="Copy id" hidden>⧉</button>
        </div>
        <div class="detail-actions detail-actions-end">
          <button id="detail-close" type="button" class="icon-btn" title="Close panel" aria-label="Close panel">Close</button>
        </div>
      </div>
      <p id="detail-meta" class="doc-path" hidden></p>
      <div id="detail-frontmatter" class="doc-meta-slot" hidden></div>
      <article id="detail-body" class="doc-body prose"></article>
    </aside>

    <noscript>This dashboard requires JavaScript.</noscript>
  </body>
</html>
