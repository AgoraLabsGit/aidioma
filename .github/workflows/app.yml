name: App CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/prototype/index.html"
      - "packages/lesson-schema/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/prototype/index.html"
      - "packages/lesson-schema/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app.yml"

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run app:typecheck
      - run: npm run app:lint
      - run: npm run app:test
      - run: npm run app:build
      - run: npm run app:smoke:install
      - run: npm run app:smoke
