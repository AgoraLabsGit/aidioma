<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>AIdioma</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="shell-header">
      <div class="brand-row">
        <strong class="brand">AIdioma</strong>
        <nav class="tabs" aria-label="Dashboard pages">
          <button type="button" class="tab" data-page="now" aria-current="page">Now</button>
          <button type="button" class="tab" data-page="roadmap">Roadmap</button>
          <button type="button" class="tab" data-page="activity">Activity</button>
          <button type="button" class="tab" data-page="knowledge">Knowledge</button>
          <button type="button" class="tab" data-page="issues">Issues</button>
        </nav>
      </div>
      <div class="heartbeat">
        <span id="issue-pill" class="issue-pill" hidden>● 0 issues</span>
        <span id="indexed-at">indexed —</span>
        <button id="reindex" type="button" title="Reindex">⟳</button>
      </div>
    </header>

    <main id="main">
      <section id="page-now" class="page" data-page-panel="now"></section>
      <section id="page-roadmap" class="page" data-page-panel="roadmap" hidden></section>
      <section id="page-activity" class="page" data-page-panel="activity" hidden></section>
      <section id="page-knowledge" class="page" data-page-panel="knowledge" hidden></section>
      <section id="page-issues" class="page" data-page-panel="issues" hidden></section>
    </main>

    <aside id="detail" class="detail" hidden>
      <div class="detail-header">
        <h2 id="detail-title">Detail</h2>
        <button id="detail-close" type="button">Close</button>
      </div>
      <pre id="detail-meta" class="detail-meta"></pre>
      <article id="detail-body" class="detail-body"></article>
    </aside>

    <noscript>This dashboard requires JavaScript.</noscript>
  </body>
</html>
