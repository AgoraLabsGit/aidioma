      - >-
        Founder proposed an icon-only star for saving the current prompt, likely at the feedback card's right edge, and distinct word-saving actions beside reviewed phrases. The eventual design must preserve a 44px target, pressed state, accessible name, and a clear distinction between saving a prompt and saving a word or phrase.
      - >-
        Founder wants Practice to support clarifying Spanish-learning questions. The current composer grades every submission, so the page plan must evaluate an explicit Answer versus Ask AIdioma interaction or follow-up button; a question must not advance the serving schedule or create learning evidence.
