  - id: PROGRESS-SAVED-001
    title: Learner Knowledge Profile and durable saved material
    area: progress
    status: open
    kind: feature
    founder_approval: required
    summary: Define a learner-owned Knowledge Profile for word and phrase evidence, attempts, saved material, session completion, review needs, and learner-visible progress without false mastery claims.
    spec: Specs/progress-and-saved-material.md
    dependencies: [PRACTICE-SERVING-001, LEXICON-001, EVALUATION-001]
    blocked_by: []
    reusable_by: [practice, lessons, home]
    next_slice: >-
      Use /plan PROGRESS-SAVED-001 to define the first useful Knowledge Profile before choosing tables: exact semantic target and contextual occurrence provenance; recognition versus production; direction/modality; attempt, assistance, and target-specific finding facts; delayed evidence; rebuildable review needs; saved prompt versus saved word/phrase identity; learner-visible list/filter views; correction/deletion; and the minimum durable release. Treat a visual knowledge graph as a later presentation option only if it helps learners choose what to practice.
    evidence:
      - >-
        Founder asked on 2026-08-04 whether AIdioma tracks understanding word by word and whether mastered, partly known, and struggling vocabulary could form a list or knowledge graph. Executable truth is that it does not: Practice has only visit-local results and the database has no learner word, phrase, attempt, saved-word, mastery, or durable Practice-session records.
      - >-
        The existing progress-and-saved-material dossier and data-and-persistence dossier are draft planning inputs, not an approved Knowledge Profile or migration plan. They preserve useful boundaries such as separating immediate accuracy from durable learning and recognition from production, but /plan must still decide the learner promise and minimum evidence model.
      - >-
        A learner-facing wordbook or filtered evidence list is the preferred first presentation candidate because it can support a clear next practice action. A relationship graph remains optional until real relationships provide more value than list states such as Seen, Practicing, Needs review, or Strong recent evidence; Mastered must not be claimed from one answer or same-turn correction.
      - >-
        Saving a prompt, saving a contextual word or phrase, and organizing a custom collection are distinct learner jobs. Durable saved vocabulary should preserve reviewed context, meaning, form, source, direction, and evidence history rather than reducing knowledge to an isolated string.
