        Founder approved replacing isolated correction chips with one complete reviewed answer on 2026-08-04. The implemented presentation is generated from the closest reviewed answer instead of provider-authored word fragments; small spelling fixes use blue with a dotted underline, while changed or missing words use rose with a solid underline.
      - >-
        Founder requested a non-orange visual direction on 2026-08-04 and subsequently rejected the violet filled surface. Current Practice feedback uses a neutral card interior with verdict-colored perimeter and heading, lighter correction text, and no repeated color key; fixed-direction sessions show direction once in the session summary while alternating sessions retain per-prompt direction labels. The 264-test app suite, build, typecheck, lint, and 42-screenshot responsive browser smoke passed.
      - >-
        Founder raised contextual word translation, saved words, and verb tables on 2026-08-04. Independent product audit recommends a staged, post-feedback-only first version using reviewed word or phrase annotations, contextual meaning, lemma and part of speech, the form used for reviewed verbs, honest visit-only saving, and links only to authored verb forms. Universal tap-any-word lookup, durable Saved Words, arbitrary AI translation, and full conjugation remain later capabilities with content, identity, authentication, and persistence dependencies.
      - >-
        Remaining candidate discussions are not approved designs: a radial session-result display, click-or-tap word help or translation, the recap's purpose and resulting redesign or removal, and collection and filter organization.
      - >-
        Founder requested on 2026-08-04 that collection level move to the bottom right, Save move above Settings at the top right, internal/range level wording become a concise B1-style label, permanent collection progress be discussed as a minimal perimeter treatment, and the mixed filter chips receive a design review.
      - >-
        Executable audit confirmed unconstrained level strings, 40px absolutely positioned card actions, one mixed organization/content chip row, visit-only Saved and latest-session score, Restaurant-only reviewed serving authority, and no learner persistence tables.
      - >-
        An independent three-perspective panel reviewed catalog information architecture, durable progress/persistence honesty, and responsive card accessibility. The synthesis recommends Browse/My practice, typed target-level metadata, removal of % latest from cards, a vertical Save/Settings rail, and a future left progress indicator gated on approved evidence.
      - >-
        A fresh adversarial audit found source-readiness, current-card disposition, sequencing, and accessible-control gaps. The revised draft separates serving authority from production readiness, removes % latest while preserving the temporary Settings launcher, splits immediate/dependent proof, defines switch and card semantics, and passed re-audit with no remaining material approval blockers.
      - npm run work:validate -- --docs-root Docs (0 errors, 0 warnings)
      - >-
