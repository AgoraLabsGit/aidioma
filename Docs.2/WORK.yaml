  - id: LEXICON-001
    title: Reviewed word and phrase directory
    area: lexicon
    status: active
    kind: system
    founder_approval: approved
    summary: Establish stable reviewed word/phrase meaning identity through one source-bound assisted Restaurant proof while preserving the current Practice experience and keeping learner memory and scheduling policy outside the Lexicon.
    spec: Specs/lexicon.md
    dependencies: [PRACTICE-SERVING-001]
    blocked_by: []
    reusable_by: [practice, lessons, translation, progress]
    next_slice: >-
      Use /close to review and publish the exact proven LEXICON-001 head. The active-prompt Word help, I don't know reveal/Continue/reinforcement, exact visit-local assistance, server projection, validators, and CI/browser proofs are implemented. Do not expand this close into global lookup, reverse indexes, learner persistence, target ranking, deployed fixture evaluation, or broad Lesson annotation.
    evidence:
      - >-
        Mike authorized `/feat LEXICON-001` on 2026-08-04 after EVALUATION-FIX-002 completed and asked the primary agent to coordinate bounded sub-agent work while preserving the current Practice UI/UX.
      - >-
        Founder initiated /plan LEXICON-001 on 2026-08-04 and requested explicit review of type-safe Zod contracts, deterministic behavior, archived component proposals, and the MCOO principle of minimum complexity for optimal output.
      - >-
        Founder initially preferred a contract capable of spanning beginner-to-intermediate Lessons and Collections; proof-first review narrowed this delivery to the real intermediate Restaurant consumer while preserving later Lesson compatibility as an extension point.
      - >-
        Independent type-safety, learner-journey, and archive/source reviews converged on a Spanish-first reviewed entry+sense contract and a separate versioned contextual sidecar while deferring conjugation paradigms, template phrases, lexical relations, external ingestion, learner writes, and adaptive service.
      - >-
        A fresh adversarial audit initially blocked embedded bindings, duplicate lexical authority, underspecified lifecycle/evidence behavior, overclaimed scenarios, and broad roadmap coupling. The revised draft passed re-audit after isolating mappings from Lesson/Restaurant payloads, defining precedence and version snapshots, narrowing claims, adding a pure reader/coverage contract, relaxing dependencies, and specifying compatibility and lifecycle proof.
      - >-
        Founder-directed historical comparison found that entry+sense identity, repository authority, lifecycle rules, and separation from learner evidence materially improve on the older speculative knowledge schemas, while the current whole-item binding and no-UI first delivery do not yet prove contextual click-any-word assistance, phrase spans, displayed forms, or assistance attribution.
      - >-
        Founder chose a proof-first development rhythm on 2026-08-04: design just ahead of implementation, demonstrate each complete learner journey in the real application, review composition after each capability, and periodically review the wider codebase rather than approving the complete architecture up front.
      - >-
        The documentation-only revision now replaces whole-item bindings with a versioned contextual map for exact bilingual spans, reviewed surface forms, structural non-equivalence, and visit-local assistance attribution; its first acceptance proof is the real Restaurant interaction, not infrastructure alone.
      - >-
        On 2026-08-04 the founder delegated final judgment after requiring review of every current draft, preservation of the Practice UI/UX, and a credible future path from lexical identity to a Knowledge Profile and target-aware Practice. The reviewing agent approved only after narrowing help to named reviewed targets, protecting the default prompt/composer, defining reveal/Continue/requeue and assisted-correct precedence, checkpointing exact assistance, separating per-item and collection hashes, and keeping learner memory plus selection policy outside the Lexicon.
      - >-
        Fresh independent cross-spec, Practice UI, and Knowledge Profile/serving audits all returned revise-before-approval on the earlier draft and supplied the bounded corrections now incorporated into the approved spec. The resulting future flow is Profile review need -> reviewed prompt opportunity -> frozen candidate pool -> unchanged whole-prompt practice-policy-v1 scheduling.
      - npm run work:typecheck
      - npm run work:test (24 tests)
      - git diff --check
      - npm run work:validate -- --docs-root Docs (22 work, 5 fixes, 10 specs, 0 errors, 0 warnings)
      - >-
        Focused current-path baseline passed 72 tests across the Practice workspace, Restaurant source, serving engine, visit checkpoint, and fixture evaluation route after the final planning revisions.
      - >-
        A fresh final adversarial recheck of the revised cross-spec contract passed with every prior blocker resolved: assistance precedence, summary honesty, per-item hashing, default UI preservation, checkpoint state, runtime projection, deferred abstractions, target-aware selection ownership, lifecycle state, and current evidence receipts are coherent.
      - >-
        EVALUATION-FIX-002 completed the prerequisite browser-proof repair: the canonical localhost command now reaches deterministic and configured Gateway evaluation, while non-loopback and Vercel-deployed requests fail closed. The full 278-test app suite, production build, and 54-screenshot Practice smoke passed.
      - >-
        LEXICON-001 now implements three reviewed lexical entries, one exact contextual map, a strict independent schema/reader, a learner-safe server projection, quiet active-prompt help, neutral I-don't-know reveal, visit-local checkpointed assistance, and reinforcement-aware outcome handling without a database, global lookup, or source-payload change.
      - >-
        Final proof passed 25 Lexicon package tests, 14 repository/tooling tests, 290 application tests, typecheck, lint, production build, the unchanged 54-screenshot Practice smoke, and an eight-screenshot focused Lexicon smoke at 320px and desktop in both themes with axe, 200% text, focus recovery, no overflow, and no help-triggered grading.
      - >-
        Fresh composition review required and verified a sole canonical hash owner, immutable origin/main content-version comparison, direct real-adapter proof, post-commit focus restoration for ready and recovery states, and CI gates with full Git history. The implementation is ready for /close without feature expansion.
  - id: EVALUATION-001
    title: Reliable shared evaluation and feedback
    area: evaluation
    status: open
    kind: feature
    founder_approval: required
    summary: Establish a source-neutral, secure comparison-first evaluator and concise feedback contract reusable by Practice and Lessons; current Practice fixtures ship answer authority to the client and use a local-only route.
    spec: Specs/evaluation-and-feedback.md
    dependencies: []
    blocked_by: []
    reusable_by: [practice, lessons]
    next_slice: >-
      Use /plan EVALUATION-001 to decide the shared Practice/Lessons feedback contract: explicit feedback language and matching fallbacks; structured coaching and immediate phrase-repair prompts after a miss; meaning-changing versus ordinary spelling treatment; calmer verdict and reviewed-answer language; reading budget; and the browser/API migration.
    evidence:
      - Independent runtime audit on 2026-08-03 confirmed that non-exact Practice answers correctly reach the AI path and that the missing EVALUATION_AI_GATEWAY_API_KEY caused the reported HTTP 503 configuration failure.
      - Founder authorized local reuse of the existing Gateway key for evaluation on 2026-08-04; the ignored apps/web/.env.local now explicitly configures EVALUATION_AI_GATEWAY_API_KEY without weakening the adapter's fail-closed ambient-key rule.
      - npm run prove:evaluate --workspace @aidioma/web passed development database identity, deterministic comparison, live Gateway AI grading, and no-persistence assertions.
      - Production-mode localhost returned HTTP 200 with status graded and evalSource ai for a non-exact Practice answer; a browser submission rendered learner feedback, advanced the completed count once, and showed no grading error.
      - >-
        EVALUATION-FIX-002 proved the canonical localhost command reaches deterministic and configured Gateway grading without a manually remembered flag. A live Vercel inventory showed the dedicated evaluation variable name already scoped to Development, Preview, and Production, but encrypted presence does not prove separate credentials or budgets. The local fixture route remains forbidden on Vercel; deployed Practice still requires the authenticated source migration owned by this work item.
      - >-
        Founder proposed breaking dense coaching into discrete bullets on 2026-08-04. Independent contract audit recommends 1-3 validated coaching points returned by the grader, never browser punctuation-splitting; this remains a planning decision because it changes shared Practice/Lesson evaluation behavior and the evaluation API.
      - >-
        Founder raised immediate reinforcement after an incorrect answer on 2026-08-04, using reviewed mappings such as available to disponible and no longer to ya no. Planning must distinguish an optional one-or-two-phrase same-turn repair from later scheduled retrieval, avoid counting the repair as mastery evidence, and decide when spelling changes are meaning-bearing enough to practice.
      - >-
        Founder reported feedback switching between English and Spanish. Current deterministic feedback is English and the AI path has no explicit learner-facing feedback-language contract; /plan must choose a default, supported values, and safe same-language fallbacks before Settings exposes the choice.
      - >-
        Founder proposed removing the large Almost and Keep working headings and the shouty A CORRECT ANSWER label. Planning should preserve an understandable non-color verdict while testing calmer status language and visually separated coaching and reviewed-answer regions.
